services:
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: poldokhtar_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-pol_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?مقدار DB_PASSWORD را در فایل .env تعیین کنید}
      POSTGRES_DB: ${DB_NAME:-poldokhtar_gis}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # پورت غیرپیش‌فرض روی هاست تا با پستگرس احتمالی خود سرور تداخل نکند؛ داخل شبکه داکر همچنان روی 5432 است
      - "${DB_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: poldokhtar_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      DEBUG: "false"
      DATABASE_URL: postgresql+psycopg://${DB_USER:-pol_user}:${DB_PASSWORD}@db:5432/${DB_NAME:-poldokhtar_gis}
      SECRET_KEY: ${SECRET_KEY:?مقدار SECRET_KEY را در فایل .env تعیین کنید}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-720}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      FIRST_ADMIN_USERNAME: ${FIRST_ADMIN_USERNAME:-admin}
      FIRST_ADMIN_PASSWORD: ${FIRST_ADMIN_PASSWORD:?مقدار FIRST_ADMIN_PASSWORD را در فایل .env تعیین کنید}
      FIRST_ADMIN_FULLNAME: ${FIRST_ADMIN_FULLNAME:-مدیر سامانه}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8006,http://127.0.0.1:8006}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-200}
    volumes:
      - uploads:/app/backend/uploads
    ports:
      # پورت غیرپیش‌فرض روی هاست (مطابق قرارداد توسعه در README)؛ داخل کانتینر همیشه 8000 است
      - "${APP_PORT:-8005}:8000"

volumes:
  pgdata:
  uploads:
