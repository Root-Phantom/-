name: veysian-gis

services:
  db:
    # دریافت ایمیج پایگاه داده از میرور ایرانی (قابل تغییر در .env با DOCKER_REGISTRY_MIRROR)
    image: ${DOCKER_REGISTRY_MIRROR:-docker.iranserver.com/}postgis/postgis:16-3.4-alpine
    container_name: veysian_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-veysian_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?مقدار DB_PASSWORD را در فایل .env تعیین کنید}
      POSTGRES_DB: ${DB_NAME:-veysian_gis}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # پورت پایگاه داده در بازه درخواستی (7000 تا 7003)
      - "${DB_PORT:-7001}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DOCKER_REGISTRY_MIRROR: ${DOCKER_REGISTRY_MIRROR:-docker.iranserver.com/}
    container_name: veysian_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      DEBUG: "false"
      DATABASE_URL: postgresql+psycopg://${DB_USER:-veysian_user}:${DB_PASSWORD}@db:5432/${DB_NAME:-veysian_gis}
      SECRET_KEY: ${SECRET_KEY:?مقدار SECRET_KEY را در فایل .env تعیین کنید}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-720}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      FIRST_ADMIN_USERNAME: ${FIRST_ADMIN_USERNAME:-admin}
      FIRST_ADMIN_PASSWORD: ${FIRST_ADMIN_PASSWORD:?مقدار FIRST_ADMIN_PASSWORD را در فایل .env تعیین کنید}
      FIRST_ADMIN_FULLNAME: ${FIRST_ADMIN_FULLNAME:-مدیر سامانه}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:7000,http://127.0.0.1:7000,http://localhost:7002,http://127.0.0.1:7002}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-200}
    volumes:
      - uploads:/app/backend/uploads
    ports:
      # پورت سامانه در بازه درخواستی (7000 تا 7003)
      - "${APP_PORT:-7000}:8000"

volumes:
  pgdata:
  uploads:
